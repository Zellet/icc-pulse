name: ICC Pulse - Refresh and deploy

# Stage 3: manual runs only. Scheduling is added after runner access is verified.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icc-pulse-pages
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh and prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate existing accepted data and website
        run: python prepare_pages.py --check

      - name: Run collector safety checks
        run: python refresh_events.py --self-test

      - name: Collect and validate fresh events
        run: python refresh_events.py

      - name: Prepare public website
        run: python prepare_pages.py --output "$RUNNER_TEMP/icc-pulse-site"

      - name: Save accepted data to main
        shell: bash
        run: |
          set -euo pipefail
          # Stop if another edit landed during collection; never force-push.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main changed during collection. Start a new workflow run."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/events.json
          if git diff --cached --quiet; then
            echo "Accepted data is unchanged."
          else
            git commit -m "Refresh accepted ICC Pulse events"
            git push origin HEAD:main
          fi
          echo "Accepted data commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload public website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/icc-pulse-site
          include-hidden-files: true

      - name: Record preparation result
        if: always()
        env:
          PREPARATION_STATUS: ${{ job.status }}
        run: |
          echo "Refresh/preparation job: $PREPARATION_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "If this job failed, inspect its first failed step. Deployment requires this job to succeed." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy website
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy accepted website
        id: deployment
        uses: actions/deploy-pages@v4
